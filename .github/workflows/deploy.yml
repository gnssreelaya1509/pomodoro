name: Deploy Flet App
on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - name: Install
        run: |
          sudo apt-get install -y libgtk-3-dev libx11-dev mesa-utils
          pip install flet
      - name: Build
        run: |
          yes | flet build web --base-url /${{ github.event.repository.name }}/
          cp build/web/index.html build/web/404.html
      - uses: actions/upload-pages-artifact@v3
        with: {path: 'build/web'}
      - uses: actions/deploy-pages@v4